name: Doshi Labs News picks

on:
  schedule:
    # Shots before the 9 AM ET send (13:00 UTC EDT / 14:00 UTC EST). Observed
    # GitHub scheduler delay is 45-110 min, so these are set early. The last
    # tick is a RESCUE run: it regenerates only if the day's picks are still
    # missing/empty (e.g. a run drew a Google-blocked runner IP) — otherwise it
    # exits without spending an API call.
    - cron: '17 8 * * *'
    - cron: '17 10 * * *'
    - cron: '17 11 * * *'   # rescue-only
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

# Two ticks can otherwise overlap (the scheduler's 45-110 min drift means the
# 08:17 run can still be going when 10:17 fires), and the later checkout's push
# is then rejected. Queue instead of cancelling: a run that has already spent an
# API call should be allowed to finish and commit.
concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate picks.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESCUE_ONLY: ${{ github.event.schedule == '17 11 * * *' && '1' || '' }}
        run: python3 generate.py
      # Commit whatever was successfully written even when the generate step
      # exited non-zero. Without this, ANY late failure (a crash after the picks
      # were assembled, a malformed history file) discards a correct digest
      # already sitting on disk, and the mailer sends "no digest today" instead.
      #
      # Safe because picks.json and history.json are written atomically
      # (wsjdaily/jsonio.py), so a partial file can never be on disk to commit,
      # and because a zero-resolved run writes nothing at all -- leaving the tree
      # clean, so the `git diff --staged --quiet` check below finds nothing to
      # commit. The failed generate step still marks the run red either way.
      #
      # !cancelled() rather than always(): on a cancel or timeout there is
      # nothing worth salvaging, and this avoids a pointless push attempt.
      - name: Commit picks.json + history.json if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "doshi-labs-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add picks.json history.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "picks: $(TZ=America/New_York date +%F)"
          # Retry with a rebase: anything landing on the branch between our
          # checkout and our push (a manual commit, a queued sibling run) makes
          # the first push fail. Observed in practice. The regenerated files are
          # authoritative, so conflicts take our version -- and during a rebase
          # "theirs" IS the commit being replayed, i.e. ours. Without this the
          # digest is built, never published, and the mailer sends "no digest".
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) - rebasing onto the new tip"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "push still failing after 3 attempts" >&2
          exit 1
