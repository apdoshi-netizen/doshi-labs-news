name: Doshi Labs News picks

on:
  schedule:
    # Four ticks across four SEPARATE hour blocks, before the 9 AM ET send
    # (13:00 UTC EDT / 14:00 UTC EST).
    #
    # Spread matters more than count. GitHub's `schedule` trigger is best-effort:
    # it drifts 45-110 min under load and can be skipped entirely. On 2026-08-27
    # it fired ZERO times all day, and because the old ticks sat inside a single
    # 3-hour window (08:17/10:17/11:17) they were not three independent attempts
    # — they were three samples of one bad block. No digest went out.
    #
    # EARLIEST SAFE TICK IS 05:17 UTC. picks.json is stamped with the ET date at
    # generation, and the mailer refuses anything not dated today. ET midnight is
    # 04:00 UTC under EDT but 05:00 UTC under EST, so an earlier tick would stamp
    # YESTERDAY for four months of the year and be rejected as stale.
    #
    # Two full runs (05:17, 09:17) and two rescues. The second full run is not
    # redundant: it re-picks against four more hours of WSJ output, so the digest
    # reflects the morning rather than the small hours. Rescues regenerate only
    # when the day's picks are missing or empty, so they cost nothing on a
    # healthy day. Net API spend is unchanged at ~2 calls/day.
    #
    # The last tick is 10:17, not 11:17: with worst-case drift (110 min) an
    # 11:17 tick lands 13:07 UTC, seven minutes AFTER the 13:00 EDT send, so the
    # last-chance rescue would arrive too late to matter. 10:17 + 110 min =
    # 12:07, comfortably inside the window in both EDT and EST.
    - cron: '17 5 * * *'
    - cron: '17 7 * * *'    # rescue-only
    - cron: '17 9 * * *'
    - cron: '17 10 * * *'   # rescue-only, last chance before the send
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

permissions:
  contents: write

# Two ticks can otherwise overlap (the scheduler's 45-110 min drift means the
# 05:17 run can still be going when 07:17 fires), and the later checkout's push
# is then rejected. Queue instead of cancelling: a run that has already spent an
# API call should be allowed to finish and commit.
concurrency:
  group: daily-picks
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate picks.json
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESCUE_ONLY: ${{ (github.event.schedule == '17 7 * * *' || github.event.schedule == '17 10 * * *') && '1' || '' }}
        run: python3 generate.py
      # Commit whatever was successfully written even when the generate step
      # exited non-zero. Without this, ANY late failure (a crash after the picks
      # were assembled, a malformed history file) discards a correct digest
      # already sitting on disk, and the mailer sends "no digest today" instead.
      #
      # Safe because picks.json and history.json are written atomically
      # (wsjdaily/jsonio.py), so a partial file can never be on disk to commit,
      # and because a zero-resolved run writes nothing at all -- leaving the tree
      # clean, so the `git diff --staged --quiet` check below finds nothing to
      # commit. The failed generate step still marks the run red either way.
      #
      # !cancelled() rather than always(): on a cancel or timeout there is
      # nothing worth salvaging, and this avoids a pointless push attempt.
      - name: Commit picks.json + history.json if changed
        if: ${{ !cancelled() }}
        run: |
          git config user.name "doshi-labs-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add picks.json history.json
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "picks: $(TZ=America/New_York date +%F)"
          # Retry with a rebase: anything landing on the branch between our
          # checkout and our push (a manual commit, a queued sibling run) makes
          # the first push fail. Observed in practice. The regenerated files are
          # authoritative, so conflicts take our version -- and during a rebase
          # "theirs" IS the commit being replayed, i.e. ours. Without this the
          # digest is built, never published, and the mailer sends "no digest".
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) - rebasing onto the new tip"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" || exit 1
          done
          echo "push still failing after 3 attempts" >&2
          exit 1
